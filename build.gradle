plugins {
    id "java"
    id "application"
    id "jacoco"
}

group = "com.rahmatwahab"
version = "0.1.0-SNAPSHOT"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = "com.rahmatwahab.codexautomation.Main"
}

dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.3"
    implementation "org.xerial:sqlite-jdbc:3.46.1.0"
    implementation "org.slf4j:slf4j-api:2.0.16"
    runtimeOnly "ch.qos.logback:logback-classic:1.5.15"

    testImplementation platform("org.junit:junit-bom:5.11.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.assertj:assertj-core:3.26.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

ext.approvedDependencyCoordinates = [
        "ch.qos.logback:logback-classic",
        "com.fasterxml.jackson.core:jackson-databind",
        "org.assertj:assertj-core",
        "org.jacoco:org.jacoco.agent",
        "org.jacoco:org.jacoco.ant",
        "org.junit:junit-bom",
        "org.junit.jupiter:junit-jupiter",
        "org.junit.platform:junit-platform-launcher",
        "org.slf4j:slf4j-api",
        "org.xerial:sqlite-jdbc"
] as Set

ext.validateDependencyDeclaration = { dependency, configurationName ->
    if (!dependency.group || !dependency.name) {
        throw new GradleException("Dependency in ${configurationName} must declare group and name: ${dependency}")
    }
    def coordinate = "${dependency.group}:${dependency.name}".toString()
    if (!approvedDependencyCoordinates.contains(coordinate)) {
        throw new GradleException("Unapproved dependency coordinate: ${coordinate}")
    }
    def version = dependency.version
    if (version && (version.contains("+") || version ==~ /.*[\[\]()].*/
            || version ==~ /(?i)latest(?:\..+)?/ || version.endsWith("-SNAPSHOT"))) {
        throw new GradleException("Unsafe dependency version for ${coordinate}: ${version}")
    }
    if (dependency instanceof org.gradle.api.artifacts.ExternalModuleDependency && dependency.changing) {
        throw new GradleException("Changing dependency is not allowed for ${coordinate}")
    }
}

tasks.named("test") {
    useJUnitPlatform()
    finalizedBy tasks.named("jacocoTestReport")
}

tasks.named("jar") {
    manifest {
        attributes(
                "Implementation-Title": "jcoding-automation",
                "Implementation-Version": project.version
        )
    }
}

tasks.register("dependencyGovernance") {
    group = "verification"
    description = "Verifies S002 dependency governance inputs are present."
    doLast {
        def wrapper = file("gradle/wrapper/gradle-wrapper.properties").text
        if (!wrapper.contains("distributionSha256Sum=")) {
            throw new GradleException("Gradle wrapper distribution checksum is required")
        }
        def lockfile = file("gradle.lockfile")
        if (!lockfile.isFile()) {
            throw new GradleException("gradle.lockfile is required; run ./gradlew dependencies --write-locks")
        }
    }
}

tasks.register("dependencySecurityCheck") {
    group = "verification"
    description = "Fails on dynamic, changing, or unapproved dependency coordinates."
    doLast {
        configurations.each { configuration ->
            if (configuration.canBeDeclared) {
                configuration.dependencies.each { dependency ->
                    validateDependencyDeclaration(dependency, configuration.name)
                }
            }
        }
    }
}

tasks.register("dependencySecuritySelfTest") {
    group = "verification"
    description = "Verifies dependency security rejects changing dependencies."
    doLast {
        [
                ["org.slf4j:slf4j-api:2.0.16", "changing"],
                ["org.slf4j:slf4j-api:[2.0,2.1)", "range"],
                ["org.slf4j:slf4j-api:latest.milestone", "latest selector"]
        ].each { declaration, label ->
            def candidate = dependencies.create(declaration) {
                if (label == "changing") {
                    changing = true
                }
            }
            try {
                validateDependencyDeclaration(candidate, "selfTest")
                throw new GradleException("dependencySecurityCheck failed to reject a ${label} dependency")
            } catch (GradleException exception) {
                def expected = label == "changing" ? "Changing dependency is not allowed" : "Unsafe dependency version"
                if (!exception.message.contains(expected)) {
                    throw exception
                }
            }
        }
    }
}

tasks.register("architectureFitness", JavaExec) {
    group = "verification"
    description = "Runs lightweight architecture boundary checks from the source tree."
    dependsOn tasks.named("testClasses")
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "com.rahmatwahab.codexautomation.architecture.ArchitectureFitnessCheck"
    args project.layout.projectDirectory.asFile.absolutePath
}

tasks.named("check") {
    dependsOn tasks.named("dependencyGovernance")
    dependsOn tasks.named("dependencySecurityCheck")
    dependsOn tasks.named("dependencySecuritySelfTest")
    dependsOn tasks.named("architectureFitness")
}

tasks.named("jacocoTestReport") {
    reports {
        xml.required = true
        html.required = true
    }
}
