name: Autonomy release gate
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autonomy-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  business-value-mocks:
    name: Business value mocks and static policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Hermetic business scenarios and static checks
        env:
          GH_TOKEN: ''
          OPENAI_API_KEY: ''
        run: ./gradlew --no-daemon autonomyReleaseGate
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomy-evidence
          path: |
            build/reports/
            build/test-results/
